<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7fb" />
    <title>Gemini Chat</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #202334;
        background: #f6f7fb;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      main { width: min(760px, 100%); min-height: 100vh; margin: 0 auto; padding: 32px 20px 24px; display: flex; flex-direction: column; }
      header { padding: 12px 4px 24px; }
      .eyebrow { margin: 0 0 8px; color: #5965d8; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(25px, 5vw, 34px); letter-spacing: -.04em; }
      .subtitle { margin: 8px 0 0; color: #73778a; font-size: 14px; }
      #messages { flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 12px 0 24px; }
      .message { max-width: 85%; padding: 14px 16px; border-radius: 18px; line-height: 1.55; font-size: 15px; overflow-wrap: anywhere; white-space: pre-wrap; }
      .message.user { align-self: flex-end; color: white; background: #5865db; border-bottom-right-radius: 5px; }
      .message.assistant { align-self: flex-start; background: white; border: 1px solid #e7e8ef; border-bottom-left-radius: 5px; box-shadow: 0 4px 16px #2428440a; }
      .message.error { color: #a52d3a; }
      form { position: sticky; bottom: 0; display: flex; gap: 10px; padding: 12px; background: #fff; border: 1px solid #e4e6ef; border-radius: 18px; box-shadow: 0 8px 28px #24284412; }
      textarea { flex: 1; min-height: 48px; max-height: 160px; resize: vertical; padding: 13px 4px; border: 0; outline: 0; color: inherit; background: transparent; font: inherit; font-size: 15px; }
      button { align-self: flex-end; min-width: 82px; height: 44px; padding: 0 16px; border: 0; border-radius: 12px; color: white; background: #5865db; font: inherit; font-weight: 650; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      .hint { margin: 10px 4px 0; color: #85899a; text-align: center; font-size: 12px; }
      @media (max-width: 520px) { main { padding: 20px 14px 16px; } .message { max-width: 94%; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Powered by Gemini</p>
        <h1>What would you like to explore?</h1>
        <p class="subtitle">Ask a question to start a conversation.</p>
      </header>
      <section id="messages" aria-live="polite" aria-label="Conversation">
        <div class="message assistant">Hi! How can I help you today?</div>
      </section>
      <form id="chat-form">
        <textarea id="prompt" aria-label="Your message" placeholder="Message Gemini..." rows="1" maxlength="3000" required></textarea>
        <button id="send" type="submit">Send</button>
      </form>
      <p class="hint">Gemini can make mistakes. Check important information.</p>
    </main>
    <script>
      const form = document.querySelector("#chat-form");
      const prompt = document.querySelector("#prompt");
      const send = document.querySelector("#send");
      const messagesElement = document.querySelector("#messages");
      const conversation = [];

      function addMessage(role, text, extraClass = "") {
        const message = document.createElement("div");
        message.className = `message ${role} ${extraClass}`.trim();
        message.textContent = text;
        messagesElement.append(message);
        message.scrollIntoView({ behavior: "smooth", block: "nearest" });
        return message;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = prompt.value.trim();
        if (!text || send.disabled) return;

        conversation.push({ role: "user", content: text });
        addMessage("user", text);
        prompt.value = "";
        send.disabled = true;
        send.textContent = "...";
        const loading = addMessage("assistant", "Thinking...");
        const requestMessages = [];
        let contextLength = 0;
        for (const message of conversation.slice(-12).reverse()) {
          if (contextLength + message.content.length > 40000) break;
          requestMessages.unshift(message);
          contextLength += message.content.length;
        }

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: requestMessages }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "The request failed.");
          conversation.push({ role: "assistant", content: result.reply });
          loading.textContent = result.reply;
        } catch (error) {
          loading.classList.add("error");
          loading.textContent = error.message || "Unable to reach the chat service.";
          conversation.pop();
        } finally {
          send.disabled = false;
          send.textContent = "Send";
          prompt.focus();
        }
      });
    </script>
  </body>
</html>
